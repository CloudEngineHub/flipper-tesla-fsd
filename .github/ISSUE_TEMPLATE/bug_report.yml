name: Bug report
description: Something is broken in the app itself
title: "[bug] <short description>"
labels: ["bug"]
body:
  - type: input
    id: app_version
    attributes:
      label: App version
      description: Release tag you downloaded from the Releases page (e.g. v2.16-beta.32)
      placeholder: "v2.16-beta.32"
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Flipper Zero + Electronic Cats CAN Add-On
        - Flipper Zero + generic MCP2515 module
        - Flipper Zero + other (please specify)
        - ESP32 — M5Stack ATOM Lite / Matrix + ATOMIC CAN
        - ESP32 — LilyGO T-CAN485
        - ESP32 — LilyGO T-2CAN
        - ESP32 — TTGO T-Display + MCP2515
        - ESP32 — Waveshare ESP32-S3-RS485-CAN
        - ESP32 — generic ESP32 + MCP2515 / SN65HVD230
        - ESP32 — other (please specify)
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Tesla firmware version (if applicable)
      placeholder: "2026.2.11"

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: screen
    attributes:
      label: Screen output / counters
      description: What did the Flipper screen or the ESP32 dashboard show? RX / TX / error counts? Screenshot welcome.
